<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Nila</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #1e1b4b; color: #fef3c7; text-align: center; padding: 16px;
      }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { margin: 0 0 20px; color: #c7d2fe; line-height: 1.5; }
      button {
        font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px;
        border: 0; background: #fef3c7; color: #1e1b4b;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Nila needs the internet to stay in sync between you two.<br />Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
